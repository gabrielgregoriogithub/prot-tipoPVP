<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>RPG Tático - Protótipo</title>
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div id="bg-scenery"></div>
  <div id="bg-left" class="bg-half bg-left"></div>
  <div id="bg-right" class="bg-half bg-right"></div>

  <div class="game">
    <div class="turn-info">
      <div id="turn-indicator">Turno: Guerreiro</div>
      <button id="top-back-btn" class="hidden">↩ Voltar</button>
      <button id="end-turn-btn" class="hidden" aria-hidden="true" tabindex="-1">Encerrar Turno</button>
      <button id="restart-btn">Reiniciar Partida</button>
      <div id="global-turn-counter" class="global-turn-counter">Turno global: 1/100</div>
    </div>

    <div class="main-layout">
      <div class="turn-order-column">
        <div class="control-toggle">
          <span class="control-toggle-label">Time vermelho controlado por:</span>
          <button id="ai-control-btn" class="toggle-btn">🤖 IA</button>
          <button id="player2-control-btn" class="toggle-btn">🎮 Jogador 2</button>
        </div>

        <div class="control-toggle">
          <span class="control-toggle-label">Time azul controlado por:</span>
          <button id="player1-human-control-btn" class="toggle-btn">🎮 Jogador 1</button>
          <button id="player1-ai-control-btn" class="toggle-btn">🤖 IA</button>
        </div>

        <div class="control-toggle">
          <span class="control-toggle-label">Cena de batalha:</span>
          <button id="battle-scene-toggle-btn" class="toggle-btn">🎬 Desligada</button>
        </div>

        <div class="control-toggle">
          <span class="control-toggle-label">Música:</span>
          <button id="music-toggle-btn" class="toggle-btn active">🎵 Ligada</button>
        </div>

        <div class="control-toggle">
          <span class="control-toggle-label">Visão:</span>
          <button id="scene3d-toggle-btn" class="toggle-btn">🧊 Ativar 3D</button>
          <button id="scene3d-rotate-left-btn" class="toggle-btn">↺ 90°</button>
          <button id="scene3d-rotate-right-btn" class="toggle-btn">↻ 90°</button>
          <button id="scene3d-elevation-up-btn" class="toggle-btn">🔼 Visão aérea +30°</button>
          <button id="scene3d-elevation-reset-btn" class="toggle-btn">↩ Ângulo original</button>
        </div>

        <div id="turn-order" class="turn-order"></div>
      </div>

      <div id="player-roster" class="roster"></div>

      <div class="center-column">
        <div id="board-wrapper" class="board-wrapper">
          <svg id="river-layer" class="river-layer" viewBox="0 0 13 13" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="river-depth" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3d9eb5" />
                <stop offset="0.48" stop-color="#237493" />
                <stop offset="1" stop-color="#164d73" />
              </linearGradient>
              <filter id="river-organic-edge" x="-20%" y="-10%" width="140%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.08 0.18" numOctaves="2" seed="17" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.09" xChannelSelector="R" yChannelSelector="G" />
              </filter>
            </defs>
            <path class="river-bank-stroke" d="M 6.5 -0.3 C 6.35 0.8 6.34 1.7 6.7 2.35 C 7.12 3.05 7.55 3.7 7.48 4.65 C 7.4 5.55 7.18 6.05 6.72 6.55 C 6.35 7.02 6.42 8.12 6.5 9.1 C 6.58 10.08 6.55 10.72 6.5 11.25 C 6.46 11.72 6.5 12.25 6.5 13.3" />
            <path class="river-water-stroke" d="M 6.5 -0.3 C 6.35 0.8 6.34 1.7 6.7 2.35 C 7.12 3.05 7.55 3.7 7.48 4.65 C 7.4 5.55 7.18 6.05 6.72 6.55 C 6.35 7.02 6.42 8.12 6.5 9.1 C 6.58 10.08 6.55 10.72 6.5 11.25 C 6.46 11.72 6.5 12.25 6.5 13.3" />
            <path class="river-flow-band river-flow-band-a" pathLength="1" d="M 6.5 -0.3 C 6.35 0.8 6.34 1.7 6.7 2.35 C 7.12 3.05 7.55 3.7 7.48 4.65 C 7.4 5.55 7.18 6.05 6.72 6.55 C 6.35 7.02 6.42 8.12 6.5 9.1 C 6.58 10.08 6.55 10.72 6.5 11.25 C 6.46 11.72 6.5 12.25 6.5 13.3" />
            <path class="river-flow-band river-flow-band-b" pathLength="1" d="M 6.5 -0.3 C 6.35 0.8 6.34 1.7 6.7 2.35 C 7.12 3.05 7.55 3.7 7.48 4.65 C 7.4 5.55 7.18 6.05 6.72 6.55 C 6.35 7.02 6.42 8.12 6.5 9.1 C 6.58 10.08 6.55 10.72 6.5 11.25 C 6.46 11.72 6.5 12.25 6.5 13.3" />
            <path class="river-current" d="M 6.48 0 C 6.4 1.2 6.52 1.95 6.88 2.52 C 7.2 3.08 7.34 3.85 7.27 4.7 C 7.15 5.25 6.95 5.9 6.75 6.42 C 6.52 7.2 6.6 8.15 6.66 8.82 C 6.68 9.3 6.68 9.7 6.7 10.15 C 6.68 10.82 6.58 11.25 6.53 11.9" />
          </svg>
          <div id="board" class="board"></div>
          <div id="structure-layer" class="structure-layer"></div>
          <div id="board-ambient" class="board-ambient">
            <span class="dust-mote"></span>
            <span class="dust-mote"></span>
            <span class="dust-mote"></span>
            <span class="dust-mote"></span>
            <span class="dust-mote"></span>
            <span class="dust-mote"></span>
            <span class="dust-mote"></span>
            <span class="dust-mote"></span>
          </div>
          <div id="unit-layer" class="unit-layer"></div>
          <div id="water-foreground-layer" class="water-foreground-layer" aria-hidden="true"></div>
          <div id="board-overlay" class="board-overlay"></div>
          <div id="screen-flash" class="screen-flash"></div>
          <div id="turn-banner" class="turn-banner"></div>
          <canvas id="scene3d-canvas" class="scene3d-canvas hidden"></canvas>
          <div id="scene3d-zoom-controls" class="scene3d-zoom-controls hidden" aria-label="Zoom da visão 3D">
            <button id="scene3d-zoom-in-btn" type="button" aria-label="Aproximar visão 3D">+</button>
            <span id="scene3d-zoom-indicator" aria-live="polite">100%</span>
            <button id="scene3d-zoom-out-btn" type="button" aria-label="Afastar visão 3D">−</button>
            <button id="scene3d-zoom-reset-btn" type="button">Reset</button>
          </div>
        </div>
      </div>

      <div id="enemy-roster" class="roster"></div>
    </div>

    <div class="log-panel">
      <h3>Registro de Combate</h3>
      <div id="log"></div>
    </div>
  </div>

  <div id="battle-end-modal" class="battle-end-modal hidden">
    <div class="battle-end-box">
      <h2 id="battle-end-title"></h2>
      <button id="battle-end-restart-btn">Reiniciar Partida</button>
    </div>
  </div>

  <div id="restart-confirm-modal" class="attack-confirm-modal hidden">
    <div class="attack-confirm-box">
      <h3>Reiniciar partida?</h3>
      <div class="attack-confirm-body">O progresso do combate atual será perdido.</div>
      <div class="attack-confirm-actions">
        <button id="restart-confirm-cancel-btn" class="attack-confirm-cancel-btn">Cancelar</button>
        <button id="restart-confirm-ok-btn" class="attack-confirm-ok-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <div id="attack-confirm-modal" class="attack-confirm-modal hidden">
    <div class="attack-confirm-box">
      <h3 id="attack-confirm-title"></h3>
      <div id="attack-confirm-body" class="attack-confirm-body"></div>
      <div class="attack-confirm-actions">
        <button id="attack-confirm-cancel-btn" class="attack-confirm-cancel-btn">Cancelar</button>
        <button id="attack-confirm-ok-btn" class="attack-confirm-ok-btn">Confirmar Ataque</button>
      </div>
    </div>
  </div>

  <div id="unit-info-modal" class="unit-info-modal hidden">
    <div class="unit-info-box">
      <h3 id="unit-info-title"></h3>
      <div id="unit-info-body" class="unit-info-body"></div>
      <div class="unit-info-actions">
        <button id="unit-info-close-btn" class="attack-confirm-cancel-btn">Fechar</button>
      </div>
    </div>
  </div>

  <div id="battle-scene-overlay" class="battle-scene-overlay hidden">
    <div class="battle-scene-backdrop">
      <div id="battle-scene-backdrop-img" class="battle-scene-backdrop-img"></div>
    </div>
    <div class="battle-scene-ground"></div>

    <div class="battle-scene-fighter battle-scene-fighter-left">
      <div class="battle-scene-nameplate">
        <span id="battle-scene-left-name" class="battle-scene-name"></span>
        <div class="battle-scene-hpbar"><div id="battle-scene-left-hpfill" class="battle-scene-hpfill"></div></div>
      </div>
      <img id="battle-scene-left-img" class="battle-scene-sprite" alt="">
    </div>

    <div class="battle-scene-fighter battle-scene-fighter-right">
      <div class="battle-scene-nameplate">
        <span id="battle-scene-right-name" class="battle-scene-name"></span>
        <div class="battle-scene-hpbar"><div id="battle-scene-right-hpfill" class="battle-scene-hpfill"></div></div>
      </div>
      <img id="battle-scene-right-img" class="battle-scene-sprite battle-scene-sprite-mirrored" alt="">
    </div>
  </div>

  <script src="game.js?v=41"></script>
  <script type="module" src="scene3d.js?v=53"></script>
</body>
</html>
